spring:
  application:
    # Spring 应用标识，仅用于日志和运行时诊断，不参与任务持久化路径计算。
    name: knowledge-agent
  profiles:
    active: openai
  ai:
    openai:
      # 仅在 openai profile 启用；密钥始终从环境变量读取，默认空值使离线模板模式可启动。
      api-key: ${OPENAI_API_KEY:sk-uG93vRV5V2Dog95J15FfCdE5DaAe438fBb17C642F2E1Ae57}
      # 支持官方服务及 OpenAI-compatible 服务；适配器会补全缺失的 /v1 后缀。
      base-url: ${OPENAI_BASE_URL:https://ai2-api.i-tudou.com}
      chat:
        options:
          # 默认模型名可按供应商替换，不将某个厂商模型硬编码到 Java 业务代码中。
          model: ${OPENAI_MODEL:gpt-5.6-terra}

server:
  # 后端 REST/SSE 监听端口；前端 Vite 开发代理默认转发到此端口。
  port: ${SERVER_PORT:8080}

agent:
  llm:
    # OpenAI-compatible 请求的 TCP 建连超时；单独配置便于区分网络不可达与模型处理较慢。
    connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:10}
    # 完整响应读取超时，默认 5 分钟，覆盖深度研究响应超过 1 分钟的场景；不是工作流总时限。
    read-timeout-seconds: ${LLM_READ_TIMEOUT_SECONDS:300}
  storage:
    # 任务状态、事件与中间工件的根目录，单机部署时是恢复任务的唯一业务状态来源。
    root: ${AGENT_STORAGE_ROOT:./data}
    # 最终 Markdown 目录，必须与任务状态目录分离，防止清理中间状态误删交付结果。
    answer-root: ${AGENT_ANSWER_ROOT:./answer}
  limits:
    # 每个审核环节的最大修复次数，避免模型输出异常时形成无限循环。
    max-research-review-rounds: ${MAX_RESEARCH_REVIEW_ROUNDS:3}
    max-answer-review-rounds: ${MAX_ANSWER_REVIEW_ROUNDS:3}
    # 预留给远程模型适配器的可重试上限；重试策略不由 LLM 自行决定。
    max-llm-retries: ${MAX_LLM_RETRIES:3}
    # 预留的单任务最长工作时长，部署时可配合外层任务监控执行取消。
    workflow-timeout-minutes: ${WORKFLOW_TIMEOUT_MINUTES:60}
    # 限制 API 输入与 Plan 规模，保护本地 JSON、Prompt 上下文与并行任务数量。
    max-question-length: 2000
    max-feedback-length: 4000
    max-plan-items: 50
  executor:
    # Research/Answer 主题允许并行的最大工作线程数；状态写入仍按任务锁串行化。
    parallelism: ${AGENT_PARALLELISM:4}

logging:
  # 除控制台外，同时落盘到此文件；可通过 LOG_FILE 覆盖为部署环境的绝对路径。
  # 任务 ID、请求 ID、工作流节点、模型调用阶段和完整异常栈均写入该文件，便于问题复盘。
  file:
    name: ${LOG_FILE:./logs/knowledge-agent.log}
  pattern:
    # requestId 由 RequestLoggingFilter 写入 MDC，可将一次 HTTP 请求关联到后续接口日志。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{40} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{40} - %msg%n"
  level:
    # 本项目记录完整的业务生命周期；不打开框架 DEBUG，防止请求体、密钥或 Prompt 被意外输出。
    com.example.agent: INFO
