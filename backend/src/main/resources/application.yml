spring:
  application:
    # Spring 应用标识，仅用于日志和运行时诊断，不参与任务持久化路径计算。
    name: knowledge-agent
  ai:
    openai:
      # 仅在 openai profile 启用；密钥始终从环境变量读取，默认空值使离线模板模式可启动。
      api-key: ${OPENAI_API_KEY:}
      # 支持官方服务及 OpenAI-compatible 服务；适配器会补全缺失的 /v1 后缀。
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          # 默认模型名可按供应商替换，不将某个厂商模型硬编码到 Java 业务代码中。
          model: ${OPENAI_MODEL:gpt-4o-mini}

server:
  # 后端 REST/SSE 监听端口；前端 Vite 开发代理默认转发到此端口。
  port: ${SERVER_PORT:8080}

agent:
  storage:
    # 任务状态、事件与中间工件的根目录，单机部署时是恢复任务的唯一业务状态来源。
    root: ${AGENT_STORAGE_ROOT:./data}
    # 最终 Markdown 目录，必须与任务状态目录分离，防止清理中间状态误删交付结果。
    answer-root: ${AGENT_ANSWER_ROOT:./answer}
  limits:
    # 每个审核环节的最大修复次数，避免模型输出异常时形成无限循环。
    max-research-review-rounds: ${MAX_RESEARCH_REVIEW_ROUNDS:3}
    max-answer-review-rounds: ${MAX_ANSWER_REVIEW_ROUNDS:3}
    # 预留给远程模型适配器的可重试上限；重试策略不由 LLM 自行决定。
    max-llm-retries: ${MAX_LLM_RETRIES:3}
    # 预留的单任务最长工作时长，部署时可配合外层任务监控执行取消。
    workflow-timeout-minutes: ${WORKFLOW_TIMEOUT_MINUTES:60}
    # 限制 API 输入与 Plan 规模，保护本地 JSON、Prompt 上下文与并行任务数量。
    max-question-length: 2000
    max-feedback-length: 4000
    max-plan-items: 50
  executor:
    # Research/Answer 主题允许并行的最大工作线程数；状态写入仍按任务锁串行化。
    parallelism: ${AGENT_PARALLELISM:4}

logging:
  level:
    # 只提升本项目日志，避免框架 DEBUG 日志泄露模型请求内容。
    com.example.agent: INFO
